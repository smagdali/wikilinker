<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --text: #1a1a1a;
      --muted: #5a5a5a;
      --border: #e1e1e1;
      --link: #0645ad;
      --bg: #ffffff;
      --brand: #c8102e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }
    .site-header {
      border-bottom: 2px solid var(--brand);
      padding: 18px 0 10px;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .site-header .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-header .logo {
      font-family: Georgia, serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--brand);
      letter-spacing: 0.5px;
    }
    .site-header nav {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: var(--muted);
    }
    .site-header nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 18px;
    }
    article {
      max-width: 720px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .kicker {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-size: 12px;
      color: var(--brand);
      font-weight: 600;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .subhead {
      font-size: 20px;
      color: var(--muted);
      font-weight: 400;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .byline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: var(--muted);
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .byline .author { color: var(--text); font-weight: 600; }
    article p {
      font-size: 18px;
      margin-bottom: 22px;
    }
    article p:first-of-type::first-letter {
      font-size: 54px;
      line-height: 0.9;
      float: left;
      padding-right: 8px;
      padding-top: 4px;
      font-weight: 700;
    }
    footer.article-footer {
      max-width: 720px;
      margin: 40px auto 80px;
      padding: 24px;
      border-top: 1px solid var(--border);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="logo">{{SITE_NAME}}</div>
      <nav>
        <a>{{NAV_WORLD}}</a>
        <a>{{NAV_SCIENCE}}</a>
        <a>{{NAV_CULTURE}}</a>
        <a>{{NAV_TECH}}</a>
      </nav>
    </div>
  </header>

  <article>
    <div class="kicker">{{KICKER}}</div>
    <h1>{{HEADLINE}}</h1>
    <p class="subhead">{{SUBHEAD}}</p>
    <div class="byline">
      <span class="author">{{AUTHOR}}</span> &middot; {{DATE}}
    </div>

    {{BODY}}
  </article>

  <footer class="article-footer">
    {{FOOTER}}
  </footer>
</body>
</html>
